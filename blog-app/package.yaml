name:                blog-app
version:             0.1.0.0
github:              "lancelet/lancelet.github.io"
license:             BSD-3-Clause
author:              "Jonathan Merritt"
maintainer:          "j.s.merritt@gmail.cpm"
copyright:           "2024 Jonathan Merritt"

extra-source-files:
- README.md
- CHANGELOG.md

# Metadata used when publishing your package
# synopsis:            Short description of your package
# category:            Web

# To avoid duplicated efforts in documentation and dealing with the
# complications of embedding Haddock markup inside cabal files, it is
# common to point users to the README.md file.
description:         Please see the README on GitHub at <https://github.com/lancelet/lancelet.github.io/blog-app#readme>

dependencies:
- base >= 4.7 && < 5
- aeson >= 2.1.2.1 && < 3
- blaze-html >= 0.9.2.0 && < 1
- bytestring >= 0.11.5.3 && < 1
- cmark >= 0.6 && < 1
- exceptions >= 0.10.7 && < 1
- path >= 0.9.5 && < 1
- path-io >= 1.8.2 && < 2
- tagsoup >= 0.14.8 && < 1
- text >= 2.0 && < 3
- time >= 1.12 && < 2
- yaml >= 0.11.11.2 && < 1

ghc-options:
- -Wall
- -Wcompat
- -Widentities
- -Wincomplete-record-updates
- -Wincomplete-uni-patterns
- -Wmissing-export-lists
- -Wmissing-home-modules
- -Wpartial-fields
- -Wredundant-constraints

library:
  source-dirs: src

executables:
  blog-app-exe:
    main:                Main.hs
    source-dirs:         app
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - blog-app

tests:
  blog-app-test:
    main:                Spec.hs
    source-dirs:         test
    ghc-options:
    - -threaded
    - -rtsopts
    - -with-rtsopts=-N
    dependencies:
    - blog-app
